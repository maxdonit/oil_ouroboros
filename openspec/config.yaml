schema: spec-driven

# Контекст и правила, которые OpenSpec подставляет в инструкции к каждому артефакту (openspec instructions …).
# Процесс доработки — скилл .claude/skills/sdd/SKILL.md; живые спеки — openspec/specs/.
context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Проект: «Нефтегазовый аналитик на Ouroboros» (oil_ouroboros). Агент — Ouroboros 7.7.0 (оркестратор диалога, свой
  образ); инструменты аналитика — графы LangGraph (src/oil_ouroboros/graphs/), отданные агенту по MCP сервисом tools.
  Стек: Python 3.10+ (образы — 3.12), FastAPI, LangGraph, pydantic-settings, Qdrant, BGE-M3 и Docling в сервисе
  encoder, Docker Compose. Консоль — ES-модули без сборки (ui/), версия ассетов — в ui/index.html.

  Где что настраивается:
  - инфраструктура, ключи, деньги, модели, состав сервисов — .env (шаблон .env.example, справочник
    docs/guide/parameters.md);
  - поведение инструментов (промпты, поиск, веб-политика, прогноз) — каталог config/current/*.yaml: схема проверяется
    при старте, отпечаток каталога входит в версию агента;
  - роль и регламент агента — его память ouroboros/memory/ (засев сервисом bootstrap).

  Состав — docker-compose.yml: ядро qdrant, encoder, gateway, tools, bootstrap, ouroboros, console; профили owner
  (канал владельца) и gigachat (прокси gpt2giga) включены по умолчанию. Агент — в сети без интернета, к моделям ходит
  только через шлюз gateway; у каждого сервиса только свои секреты (x-no-secrets). Роль и «зачем отдельно» каждого
  сервиса — x-role и x-why в compose.

  Ограничения:
  - LLM по умолчанию — GigaChat Freemium (квота токенов): полный eval стоит ~4 млн токенов Ultra и запускается только
    с согласия владельца; для проверки — выборочные кейсы (oilo eval --only …).
  - Недоступность внешнего источника не роняет сервис: он деградирует и честно показывает свежесть данных (вкладка
    «Источники»), агент называет дату данных.
  - Числа в ответе агента подтверждаются журналом доказательств (R#/W#/F#) и проверкой verify_answer; ответ без
    проверки помечается.
  - Без велосипедов: готовые библиотеки и открытые API, если они есть; своё — только с причиной в design.md.
  - Документы, комментарии, тексты UI и сообщения коммитов — на русском; ruff line-length 119.

rules:
  proposal:
    - Перечисли затронутые спеки openspec/specs/ (Capabilities) и что в изменение не входит (Non-goals).
    - Новый внешний источник данных — условия использования, нужен ли ключ, частота обновления и задержка данных,
      поведение при недоступности.
  design:
    - Сравни 2–3 варианта и выбери один с причиной.
    - Новые параметры — где живут (.env или каталог config/) и значения по умолчанию; что войдёт в версию агента.
  specs:
    - Требования — наблюдаемое поведение с конкретными именами файлов, эндпоинтов, параметров и значениями по
      умолчанию; полный текст изменяемого требования — из openspec/specs/<спека>/spec.md.
  tasks:
    - Каждая задача заканчивается проверкой (тест, команда, запрос).
    - Последние задачи — документы (README, docs/guide/*, справочник параметров) и гейты — ruff, pytest,
      openspec validate --all --strict.

operations:
  apply:
    guidance:
      - "Отмечай задачу [x] со строкой «Итог: что сделано и чем проверено»."
      - Поведение агента меняется — выборочный eval (oilo eval --only …) с согласия владельца, без полного прогона.
  archive:
    guidance:
      - После архива замени заглушку Purpose у новых спек, затем openspec validate --all --strict и
        pytest tests/test_consistency.py — и только потом коммит.
