# Поиск по отчётам во время ответа (индекс не перестраивается). Гибрид BGE-M3 dense+sparse → RRF → надбавка
# последнему выпуску → кандидаты → порядок по реранкеру (RERANKER, по умолчанию none — по RRF); отбор top_k — всегда
# LLM субагента (узел select_grade, research.yaml).
version: 1
prefetch: 40                  # кандидатов из каждой ветки (dense, sparse) до слияния RRF
rerank_candidates: 24         # кандидатов после RRF и надбавки — к реранкеру; из них LLM-отбор видит research.select_candidates
rerank_max_length: 512        # длина пары «запрос + фрагмент» для реранкера, токенов (время на CPU ∝ длине)
top_k: 6                      # сколько фрагментов попадает в контекст ответа
latest_edition_bonus: 0.15    # надбавка к оценке фрагмента из последнего выпуска серии
