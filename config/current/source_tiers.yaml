# Политика доверия к веб-источникам (версионируемая; версия пишется в журнал каждого решения).
#
# Уровень 0 — первичные данные (агентства, регуляторы, статистика).
# Уровень 1 — ценовые агентства под принципами IOSCO (Argus, Platts, OPIS, ICIS) и ведущие информагентства.
# Уровень 2 — качественная деловая и отраслевая пресса.
# Уровень 3 — «не подтверждено»: неизвестный домен или средняя оценка качества. Можно упоминать как фон,
#             нельзя опирать на него цифры (правило проверки цифр).
# deny       — жёлтая пресса, контент-фермы, конспирология: отбрасывается до попадания в контекст.
#
# Для доменов вне курируемых списков уровень выводится из агрегата экспертных рейтингов качества новостных доменов
# Lin et al., PNAS Nexus 2023 (11 520 доменов, оценка pc1 от 0 до 1; data/source_quality/domain_pc1.csv):
#   pc1 ≥ tier1_min → 1;  pc1 ≥ tier2_min → 2;  pc1 ≥ deny_below → 3;  pc1 < deny_below → deny.
# Курируемые списки имеют приоритет над агрегатом: русскоязычные СМИ в нём покрыты слабо, а государственные
# агентства любой стороны не отбрасываются молча, а маркируются (state_affiliated) и получают уровень 3.
#
# Пресс-релизы: лента релизов (press_release.wires) — уровень 3 всегда; адрес перепечатки релиза (url_patterns) —
# уровень 3 на доменах СМИ, но не на первоисточниках: релиз регулятора, агентства или биржи (уровень 0, домен органа
# власти) — это первичные данные. Порядок правил — src/oil_ouroboros/web/credibility.py.
version: "2026-10-23.2"
thresholds:
  tier1_min: 0.85
  tier2_min: 0.60
  deny_below: 0.40
