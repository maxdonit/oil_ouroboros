# Субагент research (src/oil_ouroboros/graphs/research.py): план → поиск → отбор и достаточность → веб → пакет.
version: 2
max_queries: 4                # сколько запросов к отчётам из плана идёт в поиск (+ исходная формулировка)
max_web_queries: 2            # сколько запросов идёт в веб-поиск
select_candidates: 16         # сколько кандидатов после RRF видит LLM-отбор
select_text_chars: 2000       # сколько символов каждого кандидата видит LLM-отбор — фрагмент ~450 токенов целиком (цена ∝ длине)
