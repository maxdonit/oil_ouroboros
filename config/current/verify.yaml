# Проверка ответа (verify_answer): цифры ↔ процитированные источники журнала доказательств.
version: 2
max_issues: 12                # сколько замечаний возвращается агенту для правки
max_checks: 2                 # проверок черновика на ход: после последней неудачной verify_answer велит убрать неподтверждённое и завершать (каждая проверка — раунд агента)
neighbours_hours: 0.25        # запасной путь без pack_ids: окно «соседей» цитаты, ч (ход длится минуты; шире — риск взять чужой разговор)
