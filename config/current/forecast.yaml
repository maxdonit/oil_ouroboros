# Расчётный модуль (src/oil_ouroboros/forecast). Числа сценариев и оговорки со временем устаревают — правятся здесь.
version: 5
backtest_windows: 60          # число месячных точек старта в rolling-origin бэктесте (калибровка интервалов)
max_horizon: 12               # максимальный горизонт прогноза, мес.
caveats:                      # оговорки к каждому статистическому прогнозу (показываются в ответе и во вкладке «Прогноз»)
  - "Статистический прогноз опирается только на историю цены: события после даты данных (решения OPEC+, удары по инфраструктуре, санкции) не учтены — для них используйте сценарный калькулятор."
  - "2026 год — структурный слом (перебои в Ормузском проливе): ошибки моделей в кризис выше средних по бэктесту."
scenario:                     # сценарный калькулятор шока предложения: %ΔP ≈ s / (ε_S + |ε_D|), s — доля мирового предложения
  world_supply_mbd: 102.3     # мировое предложение, млн б/с: знаменатель доли шока s (больше — тот же шок слабее)
  world_supply_source: "IEA Oil Market Report, октябрь 2026: мировое предложение 102.3 млн б/с (сентябрь 2026)"  # откуда world_supply_mbd (попадает в ответ)
  applicability_share: 0.05   # шок больше этой доли мирового предложения (~5 млн б/с) — вне калибровки эластичностей и правила запасов: импульс с предупреждением, оценки запасов нет
  presets:                    # краткосрочные эластичности предложения и спроса: три оценки из литературы дают диапазон ответа
    kilian_low:               # нижние эластичности → самый сильный ценовой эффект шока (верх диапазона)
      eps_s: 0.02             # эластичность предложения по цене: на сколько % вырастет добыча при росте цены на 1%
      eps_d: -0.13            # эластичность спроса по цене (меньше нуля): на сколько % упадёт спрос при росте цены на 1%
      source: "Kilian; Kilian & Murphy (2014): низкие эластичности"  # источник оценки (попадает в ответ)
    cci:                      # средние эластичности
      eps_s: 0.13             # эластичность предложения по цене
      eps_d: -0.13            # эластичность спроса по цене
      source: "Caldara, Cavallo, Iacoviello, Fed IFDP 1173 (2016/2019)"  # источник оценки
    bh:                       # высокие эластичности → самый слабый ценовой эффект (низ диапазона)
      eps_s: 0.20             # эластичность предложения по цене
      eps_d: -0.35            # эластичность спроса по цене
      source: "Baumeister & Hamilton, AER (2019)"  # источник оценки
  inventory_rule:             # канал запасов: пик через 6–12 мес. при устойчивом шоке, $/барр. на 1 млн б/с
    usd_per_mbd_low: 10.0     # нижняя оценка, $/барр. на 1 млн б/с: OPEC+ компенсирует потерю
    usd_per_mbd_high: 20.0    # верхняя оценка, $/барр. на 1 млн б/с: компенсации нет
    source: "Goldman Sachs (2026, через MNI): устойчивая потеря 1 млн б/с ≈ +$20/барр. без ответа OPEC+, <$10 с ответом"  # откуда оценка (попадает в ответ)
    attribution: "Goldman Sachs"  # чья это оценка: так она подписана в метке расчёта и объяснении сценария
  urals_discount:             # дисконт Urals к Dated Brent, $/барр.: бесплатного официального ряда нет — сценарий
    low: 15.0                 # узкий дисконт: верхние границы интервалов прогноза Urals
    base: 25.0                # базовый дисконт: медиана прогноза и история Urals = Brent − base
    high: 31.0                # широкий дисконт: нижние границы интервалов прогноза Urals
    sources:                  # откуда диапазон дисконта (попадает в оговорки прогноза Urals)
      - "Bloomberg, 23.02.2026: дисконт Urals к Dated Brent $30.62 — максимум с 2023 г."
      - "Пресса (Argus), апрель 2026: дисконт < $27.75"
      - "Налоговый Urals Минфина РФ — $77 (март 2026)"
quote:                        # текущие котировки: фьючерс ближайшего месяца на Мосбирже (ISS, задержка 15 мин) — инструмент price_quote
  roll_days: 3                # за сколько календарных дней до последнего дня торгов переходить на следующий контракт: вместе с фронтом NYMEX или ICE, а не на истекающем
  cache_s: 300                # сколько секунд котировка берётся из кэша без запроса к бирже (ISS и так отдаёт данные с задержкой 15 мин)
  timeout_s: 10               # таймаут запроса к ISS, с: дольше — котировка из сохранённой с пометкой «устарела»
  instruments:                # сорта котировок: ключ — аргумент benchmark инструмента price_quote; новый сорт Мосбиржи добавляется здесь
    brent:
      asset: BR               # код базового актива на срочном рынке Мосбиржи (ISS, FORTS)
      title: Brent            # название сорта в метке источника
      title_en: Brent         # название сорта в английской метке
      unit: $/барр.           # единица цены — в результате инструмента и в ответе
      unit_en: $/bbl          # единица цены по-английски
      eia: brent              # ряд спота EIA рядом с котировкой (forecast/data.py); пусто — спота нет
    wti:
      asset: WTI
      title: WTI
      title_en: WTI
      unit: $/барр.
      unit_en: $/bbl
      eia: wti
    henry_hub:
      asset: NG
      title: газ Henry Hub
      title_en: Henry Hub gas
      unit: $/MMBtu
      unit_en: $/MMBtu
      eia: henry_hub
    ttf:
      asset: TTF
      title: газ TTF
      title_en: TTF gas
      unit: €/МВт·ч
      unit_en: €/MWh
      eia: ""
