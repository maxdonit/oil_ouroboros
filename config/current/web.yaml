# Веб-поиск: когда идти в веб и что пускать в контекст. Провайдер (Tavily/Brave/DuckDuckGo) — инфраструктура и
# задаётся в .env (WEB_PROVIDER и ключи); доверие к доменам — source_tiers.yaml.
version: 1
max_results: 6                # сколько веб-источников максимум попадает в контекст
min_tier_for_numbers: 2       # худший уровень доверия (0 — лучший), источник которого может подтверждать цифры
policy:                       # в веб, если выполнено хотя бы одно условие
  needs_freshness: true       # вопрос про «сейчас/на этой неделе» или после выхода отчётов
  sufficiency: [partial, insufficient]   # вердикты оценщика достаточности, при которых идём в веб: partial — отчёты отвечают на часть вопроса, insufficient — не отвечают
  freshness_gap: true         # оценщик достаточности увидел разрыв между датой отчётов и вопросом
