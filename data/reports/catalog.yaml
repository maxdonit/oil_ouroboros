    org: EIA
    report: STEO
    title: Short-Term Energy Outlook
    edition: "2026-10"
    published: "2026-10-06"
    url: https://www.eia.gov/outlooks/steo/
    download: https://www.eia.gov/outlooks/steo/pdf/steo_full.pdf
    license: public domain (EIA)
