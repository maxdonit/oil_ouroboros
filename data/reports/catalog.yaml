# Каталог отраслевых отчётов, которые индексирует RAG.
# Поля: file — файл в data/reports; org/report — организация и серия (идут в метку цитаты);
# edition — выпуск ГГГГ-ММ (по нему «последний выпуск» получает приоритет); published — дата публикации;
# url — откуда взят; download — прямая ссылка, по которой файл получен; license — условия и указание источника.
# Все три агентства лежат в git, чтобы база была полной сразу после клонирования, без сети:
# - EIA STEO — public domain (EIA);
# - OPEC MOMR — © OPEC, воспроизводится с указанием источника;
# - IEA OMR — публичная часть отчёта на iea.org, © IEA, с указанием источника.
# Новые выпуски скачивает наблюдатель по правилам config/current/reports.yaml в общий каталог выпусков (var/reports);
# выпуск OPEC за проверкой Cloudflare загружают вручную (`oilo reports --upload`). Загрузчик объединяет оба каталога
# (src/oil_ouroboros/reports/editions.py: load). Указание источников — NOTICE.md.
# Метка цитаты в ответе: [Отчёт {org} {report}, {месяц год}, с. {страница PDF}] или раздел для HTML.
documents:
